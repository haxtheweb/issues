---
# Opened prefilled by the goggles in HAXcms (haxcms-goggles).
# The goggles fill fields by id through the link, so keep these ids stable:
# description, element, context, markup, replay.
# The title starts with the element tag in backticks so a title search finds
# every report about that element.
name: "🥽 Goggles: this confused me"
description: "Filed from the goggles' Flag lens: documentation that did not answer the question."
labels: ["goggles", "Documentation"]
body:
  - type: markdown
    attributes:
      value: |
        **Already reported?** Search open issues for the element's tag and add a 👍 there instead of filing a duplicate.
  - type: textarea
    id: description
    attributes:
      label: "What confused me"
      description: "What were you trying to do, and where did the docs fall short? Any language is fine."
    validations:
      required: true
  - type: textarea
    id: element
    attributes:
      label: Element
      description: Tag, source file and the pointer to the exact element (filled in by the goggles)
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Page, theme, build, language, viewport, browser and console errors (filled in by the goggles)
  - type: textarea
    id: markup
    attributes:
      label: Markup
      description: The block's HTML, with the site's own files swapped for placeholders
  - type: textarea
    id: replay
    attributes:
      label: Replay
      description: A packed replay bundle so the problem can be opened on a scratch site. If the goggles said it was too big for the link, drag the downloaded replay file in here.
  - type: markdown
    attributes:
      value: |
        ### Want to fix this yourself?
        Start with the HAX contributor onboarding at [lab.hax.cloud](https://lab.hax.cloud), then say so in a comment here.
